version: 2

project_name: twig

builds:
  - id: twig
    main: ./cmd/twig
    binary: twig
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}+{{.ShortCommit}}
  - id: twigd
    main: ./cmd/twigd
    binary: twigd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}+{{.ShortCommit}}

archives:
  - id: tarball
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - deploy/systemd/twigd.service

nfpms:
  - id: deb
    package_name: twig
    formats: [deb]
    maintainer: rikukaInoue
    description: "MySQL database branching with ZFS copy-on-write clones"
    license: Apache-2.0
    bindir: /usr/local/bin
    contents:
      - src: deploy/systemd/twigd.service
        dst: /lib/systemd/system/twigd.service
        type: config

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
