version: 2

project_name: sashiki

builds:
  - id: sashiki
    main: ./cmd/sashiki
    binary: sashiki
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}+{{.ShortCommit}}
  - id: sashikid
    main: ./cmd/sashikid
    binary: sashikid
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}+{{.ShortCommit}}

archives:
  - id: tarball
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - deploy/systemd/sashikid.service

nfpms:
  - id: deb
    package_name: sashiki
    formats: [deb]
    maintainer: rikukaInoue
    description: "MySQL database branching with ZFS copy-on-write clones"
    license: Apache-2.0
    bindir: /usr/local/bin
    contents:
      - src: deploy/systemd/sashikid.service
        dst: /lib/systemd/system/sashikid.service
        type: config
    scripts:
      postinstall: deploy/nfpm/postinstall.sh

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
