name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # 既知の脆弱性(Go の脆弱性 DB)チェック。必須 check にはしない
  # (新規 CVE 公開で無関係な PR がブロックされるのを避けるため advisory 運用)。
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # GitHub Action(transport=ssm)の送信経路。偽の aws で完結するので速い。
  # 実 SSM を叩かずに「送ったスクリプトがそのまま届くか」だけを見る。
  action-ssm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./e2e/action-ssm.sh

  # 実 ZFS + mysqld での E2E。GitHub の ubuntu ランナーは sudo と
  # ZFS カーネルモジュールが使えるため、loopback zpool で完結する。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          go build -o bin/sashikid ./cmd/sashikid
          go build -o bin/sashiki ./cmd/sashiki
      - name: Load ZFS kernel module
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zfsutils-linux
          sudo modprobe zfs
          zfs version
      - name: Run E2E
        run: sudo ./e2e/e2e.sh bin/sashikid bin/sashiki

  # PostgreSQL エンジンの E2E(create / reset / delete + crash-recovery 判定)。
  # スクリプトが postgresql を apt 導入し PGBIN を自動検出、loopback zpool
  # (recordsize=8k)で完結する。現状 postgres は proxy/lazy-create 未対応なので
  # 直ポート接続で検証する。ブランチ保護の required には未追加(安定するまで advisory)。
  e2e-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          go build -o bin/sashikid ./cmd/sashikid
          go build -o bin/sashiki ./cmd/sashiki
      - name: Load ZFS kernel module
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zfsutils-linux
          sudo modprobe zfs
          zfs version
      - name: Run Postgres E2E
        run: sudo ./e2e/postgres/e2e.sh bin/sashikid bin/sashiki
