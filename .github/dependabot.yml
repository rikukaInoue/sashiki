version: 2
updates:
  # Go モジュール。commit prefix は chore(deps) にして release-please の
  # CHANGELOG/版には影響させない(chore は非表示・非バンプ)。
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  # GitHub Actions のバージョン更新。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
